[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-psycheion"
dynamic = ["version"]
description = "The mind's workshop for a Seren body: watch what it senses and does, set how it behaves, make its faces."
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Chad Roesler" }]
readme = "README.md"
keywords = ["seren", "stackchan", "robot", "console", "fastapi", "viewer"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # the shell, auth, config, update checking
    "seren-meninges>=6.0.0,<7",
    # the request log, and seren_sinew.soma: the wire to the body, spelled once
    "seren-sinew>=5.7.0,<6",  # 5.7.0: rotated tokens re-read, setup_robot / robot_card
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
seren-psycheion = "seren_psycheion.__main__:main"

[project.urls]
Homepage = "https://github.com/ChadRoesler/SerenPsycheion"
Repository = "https://github.com/ChadRoesler/SerenPsycheion"
"Bug Tracker" = "https://github.com/ChadRoesler/SerenPsycheion/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["seren_psycheion*"]

# Without this the viewer's .html/.css/.js are absent from the wheel, and /viewer
# 500s on an installed copy while working from the checkout.
[tool.setuptools.package-data]
seren_psycheion = ["viewer/ui/*.html", "viewer/ui/*.css", "viewer/ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools_scm]
root = ".."
version_scheme = "release-branch-semver"
version_file = "seren_psycheion/_version.py"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
fallback_version = "0.0.0.dev0"
